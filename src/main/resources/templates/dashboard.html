<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <!-- ✅ Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- ✅ Navbar (same as View Enquiries page) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="#">Counsellor Portal</a>

        <!-- Toggle button for mobile -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/enquiry}">Add Enquiry</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/view-enquiries}">View Enquiries</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-danger" th:href="@{/logout}">Logout</a>
                </li>
            </ul>
        </div>

    </div>
</nav>

<!-- ✅ Main Content -->
<div class="container mt-5">

    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Dashboard</h4>
        </div>

        <div class="card-body">

            <div class="row g-4">

                <!-- Total Enquiries -->
                <div class="col-md-3">
                    <div class="card text-center shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="text-muted">Total Enquiries</h6>
                            <h3 class="fw-bold text-primary"
                                th:text="${dashboardInfo.getTotalEnqs}">
                            </h3>
                        </div>
                    </div>
                </div>

                <!-- Open Enquiries -->
                <div class="col-md-3">
                    <div class="card text-center shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="text-muted">Open Enquiries</h6>
                            <h3 class="fw-bold text-info"
                                th:text="${dashboardInfo.getOpenEnqs}">
                            </h3>
                        </div>
                    </div>
                </div>

                <!-- Enrolled Enquiries -->
                <div class="col-md-3">
                    <div class="card text-center shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="text-muted">Enrolled Enquiries</h6>
                            <h3 class="fw-bold text-success"
                                th:text="${dashboardInfo.getEnrolledEnqs}">
                            </h3>
                        </div>
                    </div>
                </div>

                <!-- Lost Enquiries -->
                <div class="col-md-3">
                    <div class="card text-center shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="text-muted">Lost Enquiries</h6>
                            <h3 class="fw-bold text-danger"
                                th:text="${dashboardInfo.getLostEnqs}">
                            </h3>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

</div>

<!-- ✅ Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
