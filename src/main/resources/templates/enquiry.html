<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Enquiries</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Optional custom CSS -->
    <link rel="stylesheet" th:href="@{/CSS/dashboard.css}">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="#">Counsellor Portal</a>

        <!-- ✅ TOGGLER BUTTON (IMPORTANT) -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- ✅ COLLAPSIBLE MENU -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/enquiry}">Add Enquiry</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/view-enquiries}">
                        View Enquiries
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-danger" th:href="@{/logout}">
                        Logout
                    </a>
                </li>
            </ul>
        </div>

    </div>
</nav>


<!-- Main Content -->
<div class="container-fluid mt-4 px-4">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">View Enquiries Here</h4>
        </div>
        
      <form th:action="@{/filter-enqs}"
      th:object="${viewEnquiryFilter}"
      method="post"
      class="d-flex align-items-center gap-3 mt-2 ms-4 flex-nowrap">

    <!-- Class Mode -->
    <div class="d-flex align-items-center gap-1 text-nowrap">
        <label class="small fw-semibold mb-0">
            Class&nbsp;Mode:
        </label>
        <select th:field="*{classMode}" class="form-select form-select-sm w-auto">
            <option value="">-select-</option>
            <option value="online">Online</option>
            <option value="classRoom">Classroom</option>
        </select>
    </div>

    <!-- Course Mode -->
    <div class="d-flex align-items-center gap-1 text-nowrap">
        <label class="small fw-semibold mb-0">
            Course&nbsp;Mode:
        </label>
        <select th:field="*{courseName}" class="form-select form-select-sm w-auto">
            <option value="">-select-</option>
            <option value="Java">Java</option>
            <option value="Python">Python</option>
            <option value="React">React</option>
            <option value="Oracle">Oracle</option>
            <option value="SAP">SAP</option>
            <option value="Devops">DevOps</option>
            <option value="Aws">AWS</option>
        </select>
    </div>

    <!-- Enquiry Status -->
    <div class="d-flex align-items-center gap-1 text-nowrap">
        <label class="small fw-semibold mb-0">
            Enquiry&nbsp;Status:
        </label>
        <select th:field="*{enqStatus}" class="form-select form-select-sm w-auto">
            <option value="">-select-</option>
            <option value="open">Open</option>
            <option value="enrolled">Enrolled</option>
            <option value="lost">Lost</option>
        </select>
    </div>

    <!-- Search -->
    <button type="submit" class="btn btn-primary btn-sm text-nowrap">
        search
    </button>

</form>



        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover text-center align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>S No</th>
                            <th>Name</th>
                            <th>Phone No</th>
                            <th>Course</th>
                            <th>Mode</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="enq, counter : ${Enquiries}">
                            <td th:text="${counter.index +1}"></td>
                            <td th:text="${enq.studentName}"></td>
                            <td th:text="${enq.studentPhno}"></td>
                            <td th:text="${enq.courseName}"></td>
                            <td th:text="${enq.classMode}"></td>
                            <td>
                                <span class="badge bg-info"
                                      th:text="${enq.enqStatus}"></span>
                            </td>
                            <td>
                                <a th:href="@{'/editEnq?enqId='+${enq.enq_id}}"
                                   class="btn btn-sm btn-warning">
                                    Edit
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${Enquiries.size()==0}">
                        <td colspan="7"> No records Found</td>
                        </tr>
                    </tbody>

                </table>
            </div>
        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
