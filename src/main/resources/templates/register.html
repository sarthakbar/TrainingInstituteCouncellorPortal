<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>register | Counsellor Portal</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .login-title {
      font-weight: 600;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="card login-card p-4">
    <div class="card-body">
    
    
    
    <p th:if="${emsg}" class="text-danger fw-semibold text-center">
    <span th:text="${emsg}"></span>
    </p>

     <p th:if="${smsg}" class="text-success fw-semibold text-center">
    <span th:text="${smsg}"></span>
     </p>


   

      <h3 class="text-center mb-4 login-title">Register Here</h3>

      <form th:action="@{/register}" th:object="${councellor}" method="post">

        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" th:field="*{name}" class="form-control"  placeholder="Enter Name" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" th:field="*{email}" class="form-control" placeholder="Enter email" required>
        </div>


     <div class="mb-4">
    <label class="form-label">Password</label>

    <div class="input-group">
        <input type="password"
               th:field="*{password}"
               class="form-control"
               placeholder="Enter password"
               pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[@$!%*?&])[A-Za-z0-9@$!%*?&]{8,}$"
               title="Password must be at least 8 characters and include uppercase, lowercase, number, and special character"
               required>

        <button type="button"
                class="btn btn-outline-secondary"
                onclick="togglePassword(this)">
            👀
        </button>
    </div>
</div>





       <div class="mb-3">
    <label class="form-label">Phone No</label>
    <input type="text"
           th:field="*{phoneNo}"
           class="form-control"
           placeholder="Enter 10-digit mobile number"
           pattern="[6-9][0-9]{9}"
           title="Enter valid 10-digit mobile number"
           required>
        </div>



        <div class="d-grid">
          <button type="submit" value="login" class="btn btn-primary btn-lg">
            register
          </button>
        </div>

      </form>

<div class="text-center mt-2">
    <a href="/" class="text-primary text-decoration-none">
        🔐 Click here to Login
    </a>
</div>


    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/password-toggle.js}"></script>
  
</body>
</html>
