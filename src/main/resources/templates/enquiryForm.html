<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Enquiry</title>

    <!-- ✅ Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- ✅ Navbar (same across all pages) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="#">Counsellor Portal</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/enquiry}">Add Enquiry</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/view-enquiries}">View Enquiries</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-danger" th:href="@{/logout}">Logout</a>
                </li>
            </ul>
        </div>

    </div>
</nav>

<!-- ✅ Main Content -->
<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Add New Enquiry</h4>
        </div>

        <div class="card-body">

            <!-- Error Message -->
            <div th:if="${emsg}" class="alert alert-danger text-center">
                <p class="mb-0" th:text="${emsg}"></p>
            </div>

            <!-- Success Message -->
            <div th:if="${smsg}" class="alert alert-success text-center">
                <p class="mb-0" th:text="${smsg}"></p>
            </div>

            <form th:action="@{/addEnq}" th:object="${enq}" method="post">

                <div class="row g-3">

                    <!-- Student Name -->
                    <div class="col-md-6">
                        <label class="form-label">Student Name</label>
                        <input type="text" class="form-control"
                               th:field="*{studentName}" required>
                    </div>

                    <!-- Phone Number -->
                    <div class="col-md-6">
                        <label class="form-label">Student Phone No</label>
                        <input type="number" class="form-control"
                               th:field="*{studentPhno}" required>
                    </div>

                    <!-- Class Mode -->
                    <div class="col-md-6">
                        <label class="form-label">Class Mode</label>
                        <select class="form-select" th:field="*{classMode}">
                            <option value="online">Online</option>
                            <option value="classroom">Classroom</option>
                        </select>
                    </div>

                    <!-- Course Name -->
                    <div class="col-md-6">
                        <label class="form-label">Course Name</label>
                        <select class="form-select" th:field="*{courseName}">
                            <option value="Java">Java</option>
                            <option value="Python">Python</option>
                            <option value="React">React</option>
                            <option value="Oracle">Oracle</option>
                            <option value="SAP">SAP</option>
                            <option value="Devops">Devops</option>
                            <option value="Aws">Aws</option>
                        </select>
                    </div>

                    <!-- Enquiry Status -->
                    <div class="col-md-6">
                        <label class="form-label">Enquiry Status</label>
                        <select class="form-select" th:field="*{enqStatus}">
                            <option value="Open">Open</option>
                            <option value="Enrolled">Enrolled</option>
                            <option value="Lost">Lost</option>
                        </select>
                    </div>

                </div>

                <!-- Submit Button -->
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success px-5">
                        Save Enquiry
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

<!-- ✅ Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
