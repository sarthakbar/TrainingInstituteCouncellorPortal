<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counsellor Login | Training Institute</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", sans-serif;
    }

    .login-wrapper {
      width: 100%;
      max-width: 900px;
      background: #fff;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      display: flex;
      min-height: 480px;
    }

    .left-panel {
      flex: 1;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .right-panel {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
    }

    .form-control {
      height: 46px;
    }

    .btn-primary {
      height: 46px;
      font-weight: 600;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .login-wrapper {
        flex-direction: column;
        min-height: auto;
      }
      .left-panel {
        text-align: center;
      }
    }
  </style>
</head>

<body>

<div class="login-wrapper">

  <!-- LEFT -->
  <div class="left-panel">
    <div class="brand">🎓 Training Institute</div>
    <h3 class="mt-3">Counsellor Portal</h3>
    <p class="mt-3">
      Manage student enquiries, admissions, and performance
      through a secure counsellor dashboard.
    </p>
    <ul class="mt-3">
      <li>✔ Student Enquiries</li>
      <li>✔ Admission Tracking</li>
      <li>✔ Dashboard Insights</li>
    </ul>
  </div>

  <!-- RIGHT -->
  <div class="right-panel">

    <h4 class="text-center mb-4">Counsellor Login</h4>

    <p class="text-danger text-center" th:text="${emsg}"></p>
    <p class="text-success text-center" th:text="${smsg}"></p>

    <form th:action="@{/login}" th:object="${councellor}" method="post">

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" th:field="*{email}" class="form-control"
               placeholder="Enter email" required>
      </div>

      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" th:field="*{password}" class="form-control"
               placeholder="Enter password" required>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">
          Login
        </button>
      </div>

    </form>

    <div class="text-center mt-3">
      <a href="register">New counsellor? Register here</a>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
